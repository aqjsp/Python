<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">属性查找：数据描述符优先于实例 dict</text>

  <rect x="40" y="58" width="780" height="50" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="430" y="90" text-anchor="middle" font-size="14" fill="#e65100">obj.x  →  type(obj).__dict__['x'] 是数据描述符？是则走 __get__，不看实例</text>

  <rect x="40" y="128" width="180" height="70" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="130" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">1. 数据描述符</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#c62828">__get__ + __set__</text>

  <rect x="240" y="128" width="180" height="70" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">2. 实例 __dict__</text>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#e65100">obj.__dict__['x']</text>

  <rect x="440" y="128" width="180" height="70" rx="8" fill="#c5cae9" stroke="#3f51b5" stroke-width="2"/>
  <text x="530" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f51b5">3. 非数据描述符</text>
  <text x="530" y="178" text-anchor="middle" font-size="11" fill="#3f51b5">函数 / classmethod</text>

  <rect x="640" y="128" width="180" height="70" rx="8" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
  <text x="730" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">4. __getattr__</text>
  <text x="730" y="178" text-anchor="middle" font-size="11" fill="#546e7a">找不到才到这</text>

  <line x1="220" y1="163" x2="238" y2="163" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="238,163 226,157 226,169" fill="#90a4ae"/>
  <line x1="420" y1="163" x2="438" y2="163" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="438,163 426,157 426,169" fill="#90a4ae"/>
  <line x1="620" y1="163" x2="638" y2="163" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="638,163 626,157 626,169" fill="#90a4ae"/>

  <text x="430" y="234" text-anchor="middle" font-size="13" fill="#37474f">@property 是数据描述符，所以实例同名属性盖不住它。</text>
  <text x="430" y="258" text-anchor="middle" font-size="13" fill="#37474f">普通函数是非数据描述符，实例可以挂同名可调用对象把它盖掉。</text>
  <text x="430" y="282" text-anchor="middle" font-size="12" fill="#78909c">obj.put 走第 3 步：函数.__get__(obj) 得到 bound method。</text>
</svg>
