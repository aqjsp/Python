<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="340" rx="12" fill="#fafafa"/>
  <rect width="860" height="340" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">循环引用：度数到不了 0，分代 GC 才收</text>

  <rect x="80" y="70" width="140" height="70" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Node a</text>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#c62828">refcnt ≥ 1</text>
  <rect x="320" y="70" width="140" height="70" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Node b</text>
  <text x="390" y="122" text-anchor="middle" font-size="12" fill="#c62828">refcnt ≥ 1</text>
  <path d="M 220 90 L 318 90" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#c62828">a.other</text>
  <path d="M 320 120 L 222 120" stroke="#c62828" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#c62828">b.other</text>
  <polygon points="318,90 306,84 306,96" fill="#c62828"/>
  <polygon points="222,120 234,114 234,126" fill="#c62828"/>

  <rect x="520" y="58" width="300" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="670" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">del a; del b</text>
  <text x="670" y="112" text-anchor="middle" font-size="12" fill="#e65100">只丢掉名字</text>
  <text x="670" y="134" text-anchor="middle" font-size="12" fill="#e65100">边还在，tp_dealloc 不跑</text>

  <rect x="80" y="200" width="200" height="56" rx="8" fill="#c5cae9" stroke="#3f51b5"/>
  <text x="180" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">0 代 · 新容器</text>
  <rect x="310" y="200" width="200" height="56" rx="8" fill="#9fa8da" stroke="#3f51b5"/>
  <text x="410" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">1 代 · 熬过一次</text>
  <rect x="540" y="200" width="240" height="56" rx="8" fill="#7986cb" stroke="#3f51b5"/>
  <text x="660" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2 代 · 老对象</text>
  <line x1="280" y1="228" x2="308" y2="228" stroke="#3f51b5" stroke-width="2"/>
  <polygon points="308,228 296,222 296,234" fill="#3f51b5"/>
  <line x1="510" y1="228" x2="538" y2="228" stroke="#3f51b5" stroke-width="2"/>
  <polygon points="538,228 526,222 526,234" fill="#3f51b5"/>

  <text x="430" y="286" text-anchor="middle" font-size="13" fill="#37474f">只有容器进 gc 跟踪。int / str 不参与循环检测。带 __del__ 的环可能进 gc.garbage。</text>
  <text x="430" y="310" text-anchor="middle" font-size="12" fill="#78909c">打断环：weakref，或不要互相持有。C++ 用 weak_ptr；Go 不在乎环，标记不到才收。</text>
</svg>
