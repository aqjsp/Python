<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">小整数 intern：-5 ~ 256 是同一份对象</text>

  <rect x="40" y="58" width="380" height="200" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">池内  a = 1; b = 1</text>
  <rect x="70" y="110" width="80" height="36" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="110" y="134" text-anchor="middle" font-size="14" font-family="ui-monospace, monospace" fill="#2e7d32">a</text>
  <rect x="70" y="162" width="80" height="36" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="110" y="186" text-anchor="middle" font-size="14" font-family="ui-monospace, monospace" fill="#2e7d32">b</text>
  <rect x="250" y="128" width="130" height="52" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="315" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">PyLong 1</text>
  <text x="315" y="170" text-anchor="middle" font-size="11" fill="#2e7d32">a is b → True</text>
  <line x1="150" y1="128" x2="248" y2="148" stroke="#2e7d32" stroke-width="2"/>
  <line x1="150" y1="180" x2="248" y2="160" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="234" text-anchor="middle" font-size="11" fill="#546e7a">实现细节，不要用 is 比数值</text>

  <rect x="440" y="58" width="380" height="200" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="630" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">池外  a = 1000; b = 1000</text>
  <rect x="470" y="110" width="80" height="36" rx="6" fill="#fff" stroke="#c62828"/>
  <text x="510" y="134" text-anchor="middle" font-size="14" font-family="ui-monospace, monospace" fill="#c62828">a</text>
  <rect x="470" y="162" width="80" height="36" rx="6" fill="#fff" stroke="#c62828"/>
  <text x="510" y="186" text-anchor="middle" font-size="14" font-family="ui-monospace, monospace" fill="#c62828">b</text>
  <rect x="600" y="104" width="180" height="44" rx="8" fill="#ffcdd2" stroke="#c62828"/>
  <text x="690" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">PyLong 1000</text>
  <rect x="600" y="160" width="180" height="44" rx="8" fill="#ffcdd2" stroke="#c62828"/>
  <text x="690" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">PyLong 1000</text>
  <line x1="550" y1="128" x2="598" y2="126" stroke="#c62828" stroke-width="2"/>
  <line x1="550" y1="180" x2="598" y2="182" stroke="#c62828" stroke-width="2"/>
  <text x="630" y="234" text-anchor="middle" font-size="11" fill="#546e7a">a is b → False · a == b → True</text>

  <text x="430" y="284" text-anchor="middle" font-size="11" fill="#78909c">字符串 intern 另有规则；比较值用 ==，比较身份才用 is / None</text>
</svg>
