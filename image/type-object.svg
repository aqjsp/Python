<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="280" rx="12" fill="#fafafa"/>
  <rect width="860" height="280" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">两层对象：实例的类是 Foo，Foo 的类是 type</text>

  <rect x="80" y="70" width="160" height="56" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">obj</text>
  <text x="160" y="114" text-anchor="middle" font-size="11" fill="#1565c0">Foo 的实例</text>

  <text x="270" y="96" font-size="12" fill="#546e7a">type(obj)</text>
  <line x1="240" y1="98" x2="330" y2="98" stroke="#1565c0" stroke-width="2"/>
  <polygon points="330,98 318,92 318,104" fill="#1565c0"/>

  <rect x="340" y="70" width="180" height="56" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="430" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">class Foo</text>
  <text x="430" y="114" text-anchor="middle" font-size="11" fill="#e65100">type 的实例</text>

  <text x="550" y="96" font-size="12" fill="#546e7a">type(Foo)</text>
  <line x1="520" y1="98" x2="610" y2="98" stroke="#e65100" stroke-width="2"/>
  <polygon points="610,98 598,92 598,104" fill="#e65100"/>

  <rect x="620" y="70" width="160" height="56" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="700" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">type</text>
  <text x="700" y="114" text-anchor="middle" font-size="11" fill="#6a1b9a">自己的类是自己</text>

  <path d="M 780 98 Q 830 98 830 160 Q 830 200 700 200 L 700 126" fill="none" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="790" y="168" font-size="11" fill="#6a1b9a">type(type)</text>

  <rect x="80" y="200" width="700" height="52" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="430" y="222" text-anchor="middle" font-size="13" fill="#e65100">obj.put(1) = Box.put.__get__(obj, Box) → bound method</text>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#5d4037">查找：实例 dict → 类上的函数（非数据描述符）→ 绑 self。C++ 编译期传 this；Go 是 T.Method(obj) 的糖。</text>
</svg>
