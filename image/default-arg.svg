<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">默认参数在 def 时求值一次，挂在函数对象上</text>

  <rect x="40" y="56" width="280" height="200" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="180" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f51b5">def 执行那一刻</text>
  <text x="180" y="114" text-anchor="middle" font-size="12" fill="#3949ab">造出函数对象 f</text>
  <rect x="70" y="136" width="220" height="88" rx="8" fill="#c5cae9" stroke="#3f51b5"/>
  <text x="180" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">function f</text>
  <text x="180" y="188" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#1a237e">__defaults__</text>
  <text x="180" y="208" text-anchor="middle" font-size="11" fill="#3949ab">指向那一份 list</text>

  <line x1="320" y1="180" x2="400" y2="180" stroke="#c62828" stroke-width="2.5"/>
  <polygon points="400,180 388,174 388,186" fill="#c62828"/>

  <rect x="410" y="90" width="180" height="80" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="500" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">list []</text>
  <text x="500" y="148" text-anchor="middle" font-size="12" fill="#c62828">所有「没传 xs」共享</text>

  <rect x="620" y="56" width="200" height="200" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="720" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">三次调用</text>
  <text x="720" y="118" text-anchor="middle" font-size="12" fill="#b71c1c">f(1) → [1]</text>
  <text x="720" y="144" text-anchor="middle" font-size="12" fill="#b71c1c">f(2) → [1, 2]</text>
  <text x="720" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">f(3, xs=["x"]) → ['x', 3]</text>
  <text x="720" y="196" text-anchor="middle" font-size="12" fill="#b71c1c">f(4) → [1, 2, 4]</text>
  <text x="720" y="230" text-anchor="middle" font-size="11" fill="#546e7a">第三次传入新 list</text>
  <text x="720" y="248" text-anchor="middle" font-size="11" fill="#546e7a">第四次回到默认那份</text>

  <text x="430" y="284" text-anchor="middle" font-size="12" fill="#78909c">正确写法：xs=None，函数体内 if xs is None: xs = []。C++ 默认实参每次调用一份临时量；Go 没有默认参数。</text>
</svg>
