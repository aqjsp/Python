<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="340" rx="12" fill="#fafafa"/>
  <rect width="860" height="340" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">名字是标签，对象在堆上</text>

  <rect x="40" y="58" width="240" height="250" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">命名空间（dict）</text>
  <rect x="60" y="108" width="200" height="36" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="88" y="132" font-size="14" font-family="ui-monospace, monospace" fill="#1565c0">a</text>
  <rect x="60" y="156" width="200" height="36" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="88" y="180" font-size="14" font-family="ui-monospace, monospace" fill="#1565c0">b</text>
  <rect x="60" y="204" width="200" height="36" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="88" y="228" font-size="14" font-family="ui-monospace, monospace" fill="#1565c0">x</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#546e7a">b = a 只复制绑定</text>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#546e7a">x = 1001 是换绑</text>

  <rect x="500" y="58" width="320" height="250" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="660" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">堆上的 PyObject</text>
  <rect x="530" y="108" width="260" height="70" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="660" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">list [1, 2, 3, 4]</text>
  <text x="660" y="160" text-anchor="middle" font-size="11" fill="#e65100">id 相同 · 可变 · append 两边都看见</text>
  <rect x="530" y="198" width="260" height="70" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">int 1001</text>
  <text x="660" y="250" text-anchor="middle" font-size="11" fill="#2e7d32">新对象 · 旧 int 1000 仍可能被 intern</text>

  <line x1="260" y1="126" x2="528" y2="143" stroke="#1565c0" stroke-width="2"/>
  <polygon points="528,143 516,138 516,152" fill="#1565c0"/>
  <line x1="260" y1="174" x2="528" y2="148" stroke="#1565c0" stroke-width="2"/>
  <polygon points="528,148 516,140 518,156" fill="#1565c0"/>
  <line x1="260" y1="222" x2="528" y2="233" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="528,233 516,228 516,242" fill="#2e7d32"/>

  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#78909c">C++ 的 int a=1 是盒子；Python 的 a=1 是把名字绑到堆对象</text>
</svg>
