<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="360" rx="12" fill="#fafafa"/>
  <rect width="900" height="360" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">list = 连续的 PyObject* 数组，不是链表</text>

  <rect x="30" y="58" width="200" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">PyListObject</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#1565c0">ob_size = 3</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#1565c0">allocated ≈ 4</text>

  <line x1="230" y1="103" x2="290" y2="103" stroke="#1565c0" stroke-width="2"/>
  <polygon points="290,103 278,97 278,109" fill="#1565c0"/>

  <text x="560" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">ob_item（连续指针槽）</text>
  <rect x="300" y="90" width="90" height="44" rx="4" fill="#bbdefb" stroke="#1565c0"/>
  <text x="345" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">[0]</text>
  <rect x="400" y="90" width="90" height="44" rx="4" fill="#bbdefb" stroke="#1565c0"/>
  <text x="445" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">[1]</text>
  <rect x="500" y="90" width="90" height="44" rx="4" fill="#bbdefb" stroke="#1565c0"/>
  <text x="545" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">[2]</text>
  <rect x="600" y="90" width="90" height="44" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="645" y="118" text-anchor="middle" font-size="12" fill="#607d8b">空槽</text>
  <text x="750" y="118" font-size="11" fill="#78909c">over-allocate</text>

  <line x1="345" y1="134" x2="345" y2="178" stroke="#e65100" stroke-width="1.5"/>
  <line x1="445" y1="134" x2="445" y2="178" stroke="#e65100" stroke-width="1.5"/>
  <line x1="545" y1="134" x2="545" y2="178" stroke="#e65100" stroke-width="1.5"/>

  <rect x="280" y="180" width="120" height="44" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="340" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">int 1</text>
  <rect x="380" y="180" width="120" height="44" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="440" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">str "a"</text>
  <rect x="480" y="180" width="140" height="44" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="550" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">list [2]</text>

  <rect x="30" y="250" width="840" height="84" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="50" y="278" font-size="13" font-weight="bold" fill="#f57f17">复杂度从布局长出来</text>
  <text x="50" y="302" font-size="12" fill="#5d4037">xs[i] / append 右端：O(1) 均摊　　insert(0) / pop(0)：每次搬后面全部指针，O(n)</text>
  <text x="50" y="322" font-size="12" fill="#5d4037">扩容 ≈ 1.125n + 常数，不是 2 倍　　元素本身在堆上，list 只存指针</text>
</svg>
