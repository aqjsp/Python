<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="320" rx="12" fill="#fafafa"/>
  <rect width="900" height="320" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">浅拷贝只复制容器，深拷贝递归复制对象图</text>

  <rect x="30" y="56" width="410" height="230" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">浅拷贝  b = a[:] / copy.copy(a)</text>
  <rect x="60" y="108" width="90" height="36" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="105" y="132" text-anchor="middle" font-size="13">a</text>
  <rect x="60" y="160" width="90" height="36" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="105" y="184" text-anchor="middle" font-size="13">b</text>
  <rect x="190" y="100" width="100" height="40" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="240" y="126" text-anchor="middle" font-size="12">list A</text>
  <rect x="190" y="160" width="100" height="40" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="240" y="186" text-anchor="middle" font-size="12">list B</text>
  <rect x="330" y="130" width="90" height="44" rx="6" fill="#ffcdd2" stroke="#c62828"/>
  <text x="375" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">内层 list</text>
  <line x1="150" y1="126" x2="188" y2="120" stroke="#1565c0" stroke-width="2"/>
  <line x1="150" y1="178" x2="188" y2="180" stroke="#1565c0" stroke-width="2"/>
  <line x1="290" y1="120" x2="328" y2="148" stroke="#c62828" stroke-width="2"/>
  <line x1="290" y1="180" x2="328" y2="156" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="236" text-anchor="middle" font-size="12" fill="#c62828">a[0].append(9) → b 也变</text>
  <text x="235" y="258" text-anchor="middle" font-size="11" fill="#546e7a">两层容器，一份内层对象</text>

  <rect x="460" y="56" width="410" height="230" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">深拷贝  copy.deepcopy(a)</text>
  <rect x="490" y="108" width="90" height="36" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="535" y="132" text-anchor="middle" font-size="13">a</text>
  <rect x="490" y="160" width="90" height="36" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="535" y="184" text-anchor="middle" font-size="13">b</text>
  <rect x="620" y="100" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="665" y="126" text-anchor="middle" font-size="12">list A</text>
  <rect x="620" y="160" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="665" y="186" text-anchor="middle" font-size="12">list B</text>
  <rect x="750" y="100" width="90" height="40" rx="6" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="795" y="126" text-anchor="middle" font-size="12">内层'</text>
  <rect x="750" y="160" width="90" height="40" rx="6" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="795" y="186" text-anchor="middle" font-size="12">内层''</text>
  <line x1="580" y1="126" x2="618" y2="120" stroke="#2e7d32" stroke-width="2"/>
  <line x1="580" y1="178" x2="618" y2="180" stroke="#2e7d32" stroke-width="2"/>
  <line x1="710" y1="120" x2="748" y2="120" stroke="#2e7d32" stroke-width="2"/>
  <line x1="710" y1="180" x2="748" y2="180" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#2e7d32">改 a 的内层，b 不动</text>
  <text x="665" y="258" text-anchor="middle" font-size="11" fill="#546e7a">环、自定义对象走 __deepcopy__</text>

  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#78909c">赋值 b=a 连容器都不复制。切片 / list() / copy.copy 是浅的。</text>
</svg>
